<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#00111b"><meta name="description" content="ROOT ACCESS playable mobile prototype"><title>ROOT ACCESS</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2300111b'/%3E%3Ctext x='8' y='44' fill='%2300f2ff' font-size='40' font-family='monospace'%3E%3E_%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head>
<body>
<div id="viewport"><main id="game" aria-label="ROOT ACCESS" data-panel="closed">
  <section class="hud" aria-label="Player status">
    <div class="wallet-line"><strong id="money">$2.48M</strong><span class="income">• <span id="income">+$0/s</span></span><button id="settings" class="gear" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m19.4 13 .1-1-.1-1 2-1.5-2-3.5-2.3 1a8 8 0 0 0-1.7-1L15 3h-4l-.4 3-1.8 1-2.2-1-2 3.5L6.5 11l-.1 1 .1 1-1.9 1.5 2 3.5 2.2-1 1.8 1 .4 3h4l.4-3 1.7-1 2.3 1 2-3.5z"/><circle cx="13" cy="12" r="3.8"/></svg></button></div>
    <div class="hud-bottom"><div class="rep"><div><span id="rep-level">REP LV 1</span><span id="rep">0 / 30</span></div><div class="rep-track" role="progressbar" aria-label="Reputation level 1" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0"><span id="rep-fill"></span></div></div><div class="comfort">COMFORT <span id="comfort">5</span></div></div>
  </section>
  <div class="scene" aria-label="Room"><div class="scene-inner"><img class="room-art" src="assets/room-clean.png" alt="Isometric hacker room with a server rack, computer desk and bed" draggable="false"><button class="room-target rack-target" data-room="rack" aria-label="Server rack upgrades"></button><button class="room-target server-target" data-room="automation" aria-label="Automation rigs"></button><button id="add-rack-target" class="room-target empty-target" data-room="new-rack" aria-label="Add server rack"></button><button id="new-rack-target" class="new-rack-target" data-room="rack-two" aria-label="Server rack 02" hidden><img src="assets/empty-rack.png" alt="" draggable="false"></button></div></div>
  <section id="dock" class="dock" aria-label="Game controls">
    <header class="drawer-header"><button id="drawer-toggle" aria-expanded="false" aria-controls="drawer-body"><span class="drawer-heading"><span id="drawer-title">JOBS</span><small id="rack-subtitle" hidden>Rigs, cards &amp; modems</small></span><span id="drawer-meta">1 RUNNING • 1 AUTO</span><svg class="chevron" viewBox="0 0 32 24" aria-hidden="true"><path d="M4 19 16 7l12 12"/></svg></button><button id="jobs-expand" aria-label="Expand jobs" aria-expanded="false" aria-controls="jobs-view" hidden><svg viewBox="0 0 32 24" aria-hidden="true"><path d="M4 19 16 7l12 12"/></svg></button><div id="rack-tabs" class="rack-tabs" role="group" aria-label="Select server rack" hidden><button data-rack="0" aria-pressed="true" aria-label="Show rack 01">01</button><button data-rack="1" aria-pressed="false" aria-label="Show rack 02">02</button></div><button id="buy-rack" class="action" hidden>BUY RACK<b id="rack-price">$25,000</b></button><button id="drawer-close" aria-label="Close menu" hidden>×</button></header>
    <div id="drawer-body" class="drawer-body" hidden><div id="jobs-view" hidden><div class="buy-modes" role="group" aria-label="Upgrade purchase amount"><button data-buy="1" aria-pressed="true">1×</button><button data-buy="10" aria-pressed="false">10×</button><button data-buy="100" aria-pressed="false">100×</button><button data-buy="max" aria-pressed="false">BUY MAX</button></div><div id="job-list" class="job-list"></div></div><div id="rack-view" hidden><div id="rack-list"></div></div><div id="new-rack-view" hidden><div id="new-rack-list" role="list" aria-label="Rack 02 shelves"></div></div><div id="install-view" hidden><div class="install-heading"><button id="install-back" aria-label="Back to rack">‹</button><span id="install-title">INSTALL / SLOT 03</span></div><div id="install-list"></div></div></div>
    <div class="hack-panel"><div class="tap-meta"><span><b id="tap-value">+$1.05</b> / TAP</span><span>FULL BAR <b id="full-value">+$15.75</b></span></div><div class="tap-progress"><div class="segments" id="segments" role="progressbar" aria-label="Hack bar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"></div><span id="tap-count">0 / 10</span></div><div class="speed"><span>JOB SPEED <b id="speed">×1.00</b><span id="boost-time"></span></span></div><button id="hack">HACK</button></div>
  </section>
  <div id="rewards" aria-hidden="true"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="settings-overlay" class="overlay" hidden><section role="dialog" aria-modal="true" aria-labelledby="settings-title" class="settings-card"><header><h1 id="settings-title">SETTINGS</h1><button id="settings-close" aria-label="Close settings">×</button></header><button id="resume" class="menu-button">RESUME</button><button id="reset" class="menu-button secondary">RESET DEMO</button><div id="reset-confirm" hidden><p>Reset all progress?</p><div><button id="reset-yes" class="menu-button">RESET</button><button id="reset-no" class="menu-button secondary">CANCEL</button></div></div></section></div>
</main></div><script src="engine.js"></script><script src="app.js"></script>
</body></html>
